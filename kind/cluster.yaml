kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: greeter
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - {containerPort: 30080, hostPort: 30080, listenAddress: "127.0.0.1"} # dev
      - {containerPort: 30081, hostPort: 30081, listenAddress: "127.0.0.1"} # prod
      - {containerPort: 30082, hostPort: 30082, listenAddress: "127.0.0.1"} # spare
      - {containerPort: 30090, hostPort: 30090, listenAddress: "127.0.0.1"} # prometheus
  # Three workers, not two: with two, draining one leaves a single schedulable
  # node and every replica piles onto it.
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
