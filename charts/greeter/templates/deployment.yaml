{{- $t := .Values.timing }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "greeter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "greeter.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "greeter.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ add $t.shutdownDelaySeconds $t.drainTimeoutSeconds $t.terminationBufferSeconds }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              {{- include "greeter.selectorLabels" . | nindent 14 }}
      containers:
        - name: greeter
          image: "{{ .Values.image.repository }}:{{ include "greeter.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GREETING_NAME
              value: {{ required "greetingName is required" .Values.greetingName | quote }}
            - name: WARMUP_SECONDS
              value: {{ $t.warmupSeconds | quote }}
            - name: SHUTDOWN_DELAY_SECONDS
              value: {{ $t.shutdownDelaySeconds | quote }}
            - name: DRAIN_TIMEOUT_SECONDS
              value: {{ $t.drainTimeoutSeconds | quote }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
